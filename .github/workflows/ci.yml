name: Pruebas

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      FRONTEND_ORIGIN: http://localhost:8080
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/runtime-requirements.txt
      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r app/requirements.txt
      - name: Probar backend y plantilla CDK
        working-directory: app
        run: python -m pytest tests -q
      - name: Probar terminal web
        run: node --test frontend/test/domain.test.mjs frontend/test/api.test.mjs
      - name: Validar configuracion Compose
        run: docker compose -f docker-compose.yml -f docker-compose.web.yml config --quiet
